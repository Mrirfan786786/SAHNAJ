name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install & Setup Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -s -L -o gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            unzip -q gradle-9.3.1-bin.zip
            ./gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1
            rm -rf gradle-9.3.1 gradle-9.3.1-bin.zip
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAHNAJ-AI-v1.0
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
